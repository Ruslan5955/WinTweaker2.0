name: Build exe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller --onefile --noconsole --uac-admin --collect-all customtkinter --name WinTweaker tweaker.py
      - uses: actions/upload-artifact@v4
        with:
          name: WinTweaker-exe
          path: dist/WinTweaker.exe
